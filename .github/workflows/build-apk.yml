name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          mkdir -p /opt/android-sdk/cmdline-tools
          cd /opt/android-sdk
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o c.zip
          unzip -q c.zip && rm c.zip
          mv cmdline-tools tmp-ct
          mkdir cmdline-tools
          mv tmp-ct cmdline-tools/latest
          yes | cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "sdk.dir=/opt/android-sdk" > "$GITHUB_WORKSPACE/android/local.properties"

      - name: Install Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /opt/
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Diagnose
        working-directory: android
        run: |
          echo "=== local.properties ==="
          cat local.properties
          echo "=== gradle ==="
          which gradle && gradle --version | head -3
          echo "=== SDK ==="
          ls /opt/android-sdk/platforms/
          ls /opt/android-sdk/build-tools/
          echo "=== project files ==="
          cat build.gradle.kts
          cat app/build.gradle.kts
          cat settings.gradle.kts

      - name: Build
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: agentflows-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
