name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and setup Android SDK
        run: |
          SDK=""
          for d in /usr/local/lib/android/sdk $ANDROID_HOME $ANDROID_SDK_ROOT $HOME/Android/Sdk; do
            if [ -d "$d/platforms" ]; then SDK="$d"; break; fi
          done
          if [ -z "$SDK" ]; then
            echo "No pre-installed SDK, downloading..."
            SDK=$HOME/android-sdk
            mkdir -p "$SDK"
            cd "$SDK"
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip | unzip -q -
            if [ -d cmdline-tools/bin ]; then
              mkdir -p cmdline-tools/latest
              mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/latest/ 2>/dev/null || true
            fi
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || \
            yes | "$SDK/cmdline-tools/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
          echo "Using SDK: $SDK"
          ls "$SDK"
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Install Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /opt/
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon 2>&1 | tail -30

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: agentflows-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
