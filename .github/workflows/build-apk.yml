name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          ls -la /usr/local/lib/android/sdk/ 2>/dev/null || echo "SDK not at default, trying ANDROID_HOME"

      - name: Build
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agentflows-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
