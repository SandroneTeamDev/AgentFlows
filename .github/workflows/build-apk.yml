name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find and setup Android SDK
        run: |
          SDK=""
          for d in /usr/local/lib/android/sdk $ANDROID_HOME $ANDROID_SDK_ROOT $HOME/Android/Sdk; do
            if [ -d "$d/platforms" ]; then SDK="$d"; break; fi
          done
          if [ -z "$SDK" ]; then
            SDK=$HOME/android-sdk
            mkdir -p "$SDK" && cd "$SDK"
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip | unzip -q -
            [ -d cmdline-tools/bin ] && { mkdir -p cmdline-tools/latest && mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/latest/ 2>/dev/null; }
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Install Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /opt/
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: android
        run: |
          gradle :app:assembleDebug --no-daemon > /tmp/build-output.log 2>&1
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            cat /tmp/build-output.log | grep -A5 -E "error|FAILED|unresolved|Cannot" | head -60
            exit 1
          fi
          ls -la app/build/outputs/apk/debug/

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build-output.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: agentflows-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
