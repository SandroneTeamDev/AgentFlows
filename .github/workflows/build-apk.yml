name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          set -x
          mkdir -p $HOME/a-sdk && cd $HOME/a-sdk
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o c.zip
          unzip -q c.zip
          echo "=== extracted ==="
          find . -name "sdkmanager" -type f
          export ANDROID_HOME=$HOME/a-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -5
          echo "=== sdk installed ==="
          ls $ANDROID_HOME/

      - name: local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Install Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /opt/
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH
          gradle --version

      - name: Build
        working-directory: android
        run: |
          gradle :app:assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== BUILD FAILED, last 80 lines ==="
            tail -80 /tmp/build.log
            exit 1
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: agentflows-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
