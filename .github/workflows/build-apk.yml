name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          set -e
          mkdir -p /opt/android-sdk/cmdline-tools
          cd /opt/android-sdk
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o c.zip
          unzip -q c.zip
          rm -f c.zip
          mv cmdline-tools tmp-ct
          mkdir -p cmdline-tools
          mv tmp-ct cmdline-tools/latest
          export ANDROID_HOME=/opt/android-sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -3
          echo "sdk.dir=/opt/android-sdk" > "$GITHUB_WORKSPACE/android/local.properties"

      - name: Install Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/g.zip
          unzip -q /tmp/g.zip -d /opt/
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: agentflows-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
