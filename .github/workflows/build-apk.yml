name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    container:
      image: gradle/gradle:8.5-jdk17
    steps:
      - uses: actions/checkout@v4

      - name: Install Android SDK
        run: |
          apt-get update && apt-get install -y openjdk-17-jdk unzip zip > /dev/null 2>&1
          mkdir -p /opt/android-sdk/cmdline-tools
          cd /opt/android-sdk
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip | unzip -q -
          mv cmdline-tools tmp-ct
          mkdir -p cmdline-tools
          mv tmp-ct cmdline-tools/latest
          export ANDROID_HOME=/opt/android-sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -3
          echo "sdk.dir=$ANDROID_HOME" > /android/local.properties

      - name: Build
        working-directory: /android
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: agentflows-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
